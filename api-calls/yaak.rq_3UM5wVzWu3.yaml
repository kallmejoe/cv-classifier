\n\nSelected Projects\n- Resume Classifier Prototype: End-to-end pipeline (data cleaning, TF‑IDF, ensemble classifier, Flask API). Deployed model artifacts to S3 and served predictions via a REST endpoint.\n- Real-time ETL: Built a streaming ETL that cleans, enriches, and loads data into a data warehouse using Kafka and Airflow (proof of concept).\n- Personal: Open-source tool for resume parsing and keyword extraction (GitHub repo with unit tests and docs).\n\nEducation\nB.Sc. in Computer Engineering — Cairo University\n2013 – 2017\n\nCertifications\n- AWS Certified Solutions Architect – Associate\n- Coursera: Machine Learning Specialization (Andrew Ng)\n\nAdditional\n- Publications: “Practical ML Pipelines for Resume Classification” (internal whitepaper)\n- Languages: English (fluent), Arabic (native)\n- Interests: scalable systems, ML fairness, mentoring,",
